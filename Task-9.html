<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event </title>
</head>

<body>
    <button id="btn"> Submit </button>

</body>
<script>

    //task-1:Create a simple webpage with a button that, when clicked, displays an alert 
    // saying"Button clicked!" using JavaScript event listeners.

    const button = document.getElementById("btn");
    button.addEventListener("click", () => {

        alert("Button clicked!");

    });
</script>

</html>
