<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM-manipulation</title>
</head>

<body>
    <p> Hello, World!</p>
</body>
<script>
    //task-1: Create an HTML page with a paragraph (<p>) that displays "Hello, World!".
    // • Use JavaScript to:
    // • Change the text inside the paragraph to "JavaScript is fun!".
    // • Change the color of the paragraph to blue.

    const p = document.querySelector("p");
    p.textContent = "Javascript is fun";
    p.style.color = "blue";
</script>

</html>
