<script>

    //task-1: print 1 to 10
    for (let i = 1; i <= 10; i++) {
        console.log(i);
    }

    //task-2:Create a JavaScript program that uses a whileloop to sum all even numbers 
    // between 1 and 20.
    let i = 1;
    let sum = 0;

    while (i <= 20) {
        if (i % 2 === 0) {
            sum = sum + i;
        }
        i++;
    }
    console.log(sum);

    //task-3:Write a do-whileloop that continues to ask the user for input until they enter a 
    // number greater than 10.
    let num;

    do {

        num = Number(prompt("Enter a number greater than 10"));

    }

    while (num <= 10);

    console.log("You entered:", num);


</script>

</html>
