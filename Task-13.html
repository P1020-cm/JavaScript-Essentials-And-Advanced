<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try Catch Example</title>
</head>

<body>

</body>

<script>

    try{

        let num1 = 10;

        let num2 = 0;


        if(num2 === 0){

            throw new Error("Cannot divide by zero!");

        }


        let result = num1 / num2;

        console.log(result);

    }

    catch(error){

        console.log("Error:", error.message);

    }

</script>

</html>
